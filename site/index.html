<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scorigami NBB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: placar de ginásio. Barra superior escura fixa, faixa de filtros, grid em canvas com legenda; laterais com listas curtas. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#131923; --muted:#5A6577; --line:#DCE1E9;
  --accent:#D9561A; --accent-ink:#FFFFFF; --bar:#131923; --bar-ink:#EEF1F5;
  --empty:#E6EAF0; --freq-lo:#FCD8BC; --freq-hi:#8E2A04; --first-lo:#D3E5F3; --first-hi:#0B355C;
  --ok:#1F7A4D; --warn:#A35B00; --hl:#131923;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1118; --surface:#151B25; --ink:#E7EBF1; --muted:#95A1B3; --line:#263041;
  --accent:#F07633; --accent-ink:#1A0B02; --bar:#080B10; --bar-ink:#E7EBF1;
  --empty:#1B2330; --freq-lo:#4B2613; --freq-hi:#FFB37C; --first-lo:#1C3550; --first-hi:#8FD0FF;
  --ok:#5BC48F; --warn:#F0B35A; --hl:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1118; --surface:#151B25; --ink:#E7EBF1; --muted:#95A1B3; --line:#263041;
  --accent:#F07633; --accent-ink:#1A0B02; --bar:#080B10; --bar-ink:#E7EBF1;
  --empty:#1B2330; --freq-lo:#4B2613; --freq-hi:#FFB37C; --first-lo:#1C3550; --first-hi:#8FD0FF;
  --ok:#5BC48F; --warn:#F0B35A; --hl:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);color:var(--bar-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-decoration:none;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand b{color:var(--accent)}
nav.main{display:flex;gap:2px;overflow-x:auto;flex:1 1 420px;min-width:0;scrollbar-width:none}
nav.main a{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;padding:6px 10px;border-radius:var(--r);white-space:nowrap;opacity:.78}
nav.main a:hover{opacity:1;background:rgba(127,127,127,.18)}
nav.main a[aria-current="page"]{opacity:1;background:var(--accent);color:var(--accent-ink)}
.tools{display:flex;gap:8px;align-items:center}
.tools select,.tools button{font:inherit;font-size:13px;background:transparent;color:var(--bar-ink);border:1px solid rgba(127,127,127,.45);border-radius:var(--r);padding:4px 8px;cursor:pointer}
.tools select option{color:#131923;background:#fff}
.notice{background:color-mix(in srgb,var(--accent) 12%,var(--bg));border-bottom:1px solid var(--line);font-size:13.5px}
.notice .wrap{padding-block:8px}
.filters{border-bottom:1px solid var(--line);background:var(--surface)}
.filters .wrap{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-end;padding-block:12px}
.flt{position:relative;display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1 1 150px;max-width:240px}
.flt>label,.seg>.lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flt-btn{font:inherit;text-align:left;display:flex;justify-content:space-between;gap:6px;align-items:center;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;cursor:pointer;white-space:nowrap;overflow:hidden}
.flt-btn span{overflow:hidden;text-overflow:ellipsis}
.flt-btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.flt-pop{position:absolute;top:100%;left:0;margin-top:4px;z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18);width:max(100%,250px);max-width:calc(100vw - 32px);padding:8px;display:flex;flex-direction:column;gap:6px}
.flt-pop input[type=search]{font:inherit;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink)}
.flt-opts{max-height:260px;overflow:auto;display:flex;flex-direction:column}
.flt-opts label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:4px;cursor:pointer}
.flt-opts label:hover{background:var(--bg)}
.flt-act{display:flex;justify-content:space-between;gap:8px}
.lnk{font:inherit;font-size:13px;background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 4px;font-weight:600}
.seg{display:flex;flex-direction:column;gap:4px}
.seg .opts{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{font:inherit;font-size:14px;border:0;background:var(--bg);color:var(--ink);padding:6px 10px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
main{padding-block:22px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,44px);line-height:1.05}
h2{font-size:24px;line-height:1.1}
h3{font-size:19px}
.sub{color:var(--muted);margin:4px 0 0}
.head{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.counter b{color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.gridbox{overflow-x:auto;padding-bottom:4px}
.axis-x{font-size:12px;color:var(--muted);margin:4px 0 0 34px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.axis-y{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg);text-align:right}
.gridrow{display:flex;gap:4px;align-items:flex-start;width:max-content}
canvas.grid{display:block;cursor:pointer;touch-action:manipulation}
.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.legend .bar{width:160px;height:10px;border-radius:2px}
.legend .sw{width:10px;height:10px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:4px}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:var(--r);font-size:13px;line-height:1.35;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tip .sc{font-family:var(--f-display);font-weight:700;font-size:22px}
.side{display:flex;flex-direction:column;gap:16px}
ol.list,ul.list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.score{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;text-decoration:none;white-space:nowrap}
.score:hover{color:var(--accent)}
.meta{color:var(--muted);font-size:13px;min-width:0}
.num{font-variant-numeric:tabular-nums;text-align:right}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.po{border-color:var(--accent);color:var(--accent)}
.pill.sg{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.card:hover{border-color:var(--accent)}
.card .t{font-family:var(--f-display);font-weight:700;font-size:21px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:0 0 18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .d{font-size:13px;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(64px,14vw,120px);line-height:.9;font-variant-numeric:tabular-nums}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.prose{max-width:68ch}
.prose p,.prose li{margin:0 0 10px}
.prose h2{margin:26px 0 8px}
form.adj{display:grid;gap:14px;max-width:620px}
form.adj label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
form.adj input,form.adj select,form.adj textarea{font:inherit;font-weight:400;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);padding:9px 16px;cursor:pointer;justify-self:start}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.ok{border:1px solid var(--ok);border-radius:var(--r);padding:12px 14px;background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
pre.msg{white-space:pre-wrap;font-size:13px;background:var(--bg);padding:10px;border-radius:var(--r);border:1px solid var(--line)}
.tl-ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.tl-ctrl input[type=range]{flex:1 1 260px;accent-color:var(--accent)}
.tl-date{font-family:var(--f-display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;min-width:9ch}
.h2h{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;text-align:center;margin:8px 0 18px}
.h2h .n{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.h2h .tm{font-family:var(--f-display);font-weight:700;font-size:22px}
.pick{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.pick label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pick select{font:inherit;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);min-width:180px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.empty{color:var(--muted);padding:24px 0}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{padding-block:18px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <a class="brand" href="#home" id="brand">Scorigami <b>NBB</b></a>
  <nav class="main" id="nav" aria-label="Principal"></nav>
  <div class="tools">
    <select id="lang" aria-label="Idioma"><option value="pt">PT</option><option value="en">EN</option><option value="es">ES</option></select>
    <button id="theme" type="button"></button>
  </div>
</div></header>
<div class="notice"><div class="wrap" id="notice"></div></div>
<div class="filters" id="filters" hidden><div class="wrap" id="fbar"></div></div>
<main class="wrap" id="view"></main>
<footer data-azeredo-assinatura><div class="wrap"><span id="foot1"></span><span id="foot2"></span></div></footer>
<script src="https://azeredo.app/assinatura.js" defer></script>
<div class="tip" id="tip" hidden></div>

<script>
fetch("games.json").then(r => r.json()).then(d => {
  window.__DATA = d;
  const s = document.createElement("script"); s.src = "app.js"; document.body.appendChild(s);
});
</script>
</body>
</html>
